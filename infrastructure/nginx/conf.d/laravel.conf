# ==============================================================================
# laravel.conf - Webroot Hardening & Virtual Host Configuration
# DevOps & Infrastructure Sage (v3.0.0)
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # HARDENING RULE 1: Strict Webroot Isolation
    # Only the 'public' subfolder is exposed; parent Laravel directory (.env, app, etc.)
    # is strictly inaccessible from the filesystem root.
    root /var/www/html/public;
    index index.php index.html;

    # Character set
    charset utf-8;

    # --------------------------------------------------------------------------
    # Security Headers (Defense in Depth)
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always; # Modern standard: disables legacy faulty XSS auditors
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # --------------------------------------------------------------------------
    # Health Check Endpoint (Laravel 11+ / Docker Compose Probes)
    # --------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    # --------------------------------------------------------------------------
    # HARDENING RULE 2: Block Sensitive Files & Hidden Directories
    # Blocks .env, .env.*, .git, .github, .svn, .htaccess, etc.
    # Returns 404 instead of 403 to prevent directory/file existence discovery.
    # --------------------------------------------------------------------------
    location ~* (^|/)\. {
        # Allow ACME Challenge for Let's Encrypt certificates if needed
        location ~ ^/\.well-known/acme-challenge/ {
            allow all;
        }
        deny all;
        return 404;
        access_log off;
        log_not_found off;
    }

    # Explicit defense for .env variants in any query or path pattern
    location ~* (^|/)\.env {
        deny all;
        return 404;
        access_log off;
        log_not_found off;
    }

    # Block access to source code metadata, lockfiles, and package configurations
    location ~* \.(json|lock|md|yml|yaml|sql|log|sh|bat)$ {
        deny all;
        return 404;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # HARDENING RULE 3: Disable Script Execution and Block Sensitive Files in storage/
    # In Laravel, 'public/storage' is symlinked to 'storage/app/public'.
    # Uses standard prefix (without ^~) so server-wide protection rules apply,
    # plus explicit internal guards against scripts and sensitive dumps/backups.
    # --------------------------------------------------------------------------
    location /storage/ {
        # Strictly forbid passing any script file to FastCGI
        location ~* \.(php|phar|phtml|php[3-8]|sh|bash|py|pl|cgi|exe)$ {
            deny all;
            return 404;
        }

        # Block access to database dumps, logs, environment backups in storage
        location ~* \.(sql|log|bak|backup|env|env.*|conf|ini|key|pem|crt)$ {
            deny all;
            return 404;
        }

        # Block hidden files inside storage
        location ~* (^|/)\. {
            deny all;
            return 404;
        }

        # Serve purely as static files
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # --------------------------------------------------------------------------
    # Standard Static Assets Caching & Handling
    # --------------------------------------------------------------------------
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --------------------------------------------------------------------------
    # HARDENING RULE 4: Single Point of Entry (public/index.php only)
    # All web requests are dispatched to index.php.
    # NO OTHER .php file can ever be executed directly.
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Dedicated handler for index.php ONLY
    location = /index.php {
        # Mitigate cgi.fix_pathinfo=1 execution vulnerability
        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php_backend;
        fastcgi_index index.php;

        # Mitigate HTTPoxy vulnerability (RFC 3875)
        fastcgi_param HTTP_PROXY "";

        # FastCGI standard parameters
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Security & Buffer tuning
        fastcgi_intercept_errors on;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_read_timeout 60s;
    }

    # Block any direct execution of any other .php file!
    location ~ \.php$ {
        deny all;
        return 404;
    }

    # Favicon and Robots handling
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
