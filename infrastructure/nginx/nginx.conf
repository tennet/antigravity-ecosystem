# ==============================================================================
# nginx.conf - High-Performance Hardened Master Configuration
# DevOps & Infrastructure Sage (v3.0.0)
# ==============================================================================

user nginx;
worker_processes auto;
worker_cpu_affinity auto;
pid /var/run/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Information Disclosure Hardening
    server_tokens off;

    # Performance & Network Tweaks
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # Buffer & DoS Defenses
    client_max_body_size 20M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Timeouts
    client_body_timeout 15;
    client_header_timeout 15;
    send_timeout 15;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Structured JSON Logging for Observability
    log_format json_analytics escape=json
      '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
      '}';

    access_log /var/log/nginx/access.log json_analytics;

    # FastCGI Cache Configuration
    fastcgi_cache_path /var/cache/nginx levels=1:2 keys_zone=LARAVEL_CACHE:100m inactive=60m max_size=512m;
    fastcgi_cache_key "$scheme$request_method$host$request_uri";

    # Upstream definition for PHP 8.4-FPM
    upstream php_backend {
        server php:9000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # Load Virtual Hosts
    include /etc/nginx/conf.d/*.conf;
}
