; ==============================================================================
; php.ini - Hardened PHP 8.4 Production Configuration
; DevOps & Infrastructure Sage (v3.0.0)
; ==============================================================================

[PHP]
; Information Disclosure Hardening
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
error_log = /dev/stderr

; Resource Limits & Execution
max_execution_time = 30
max_input_time = 60
memory_limit = 256M
post_max_size = 25M
upload_max_filesize = 20M
max_file_uploads = 20
default_socket_timeout = 60

; CRITICAL SECURITY: FastCGI Path Traversal Defense
; Prevents Nginx/FastCGI from guessing script names or executing uploaded images
cgi.fix_pathinfo = 0

; Session Hardening
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 7200

[Opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.max_wasted_percentage = 10
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1
