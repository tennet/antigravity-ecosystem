[global]
daemonize = no
error_log = /dev/stderr
log_level = notice

[www]
listen = 0.0.0.0:9000
listen.backlog = 511

; Unprivileged non-root execution
user = appuser
group = appuser

; Process management
pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000

; FastCGI Healthcheck probe
ping.path = /ping
ping.response = pong
pm.status_path = /status

; Logging & Security
access.log = /dev/stdout
access.format = "[%t] \"%m %r%Q%q\" %s %f %{mili}dms %{kilo}Mkb %C%%"
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
