version: "3.8"

networks:
  lab_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  mariadb_data:
  glpi_config:
  glpi_files:
  glpi_marketplace:
  zimbra_data:

services:
  # ============================================================================
  # 1. DATABASE: MariaDB 10.11 (Hardened per GLPI 10)
  # ============================================================================
  mariadb:
    image: mariadb:10.11
    container_name: lab-mariadb
    restart: unless-stopped
    networks:
      lab_net:
        ipv4_address: 172.28.0.11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro
      - ./mariadb/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================================================
  # 2. GLPI 10: Web Application + CLI Cron Daemon (Email-to-Ticket Engine)
  # ============================================================================
  glpi:
    build:
      context: ./glpi
      dockerfile: Dockerfile
    container_name: lab-glpi
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      lab_net:
        ipv4_address: 172.28.0.10
    ports:
      - "${GLPI_WEB_PORT}:80"
    environment:
      GLPI_LANG: it_IT
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - glpi_config:/var/www/html/glpi/config
      - glpi_files:/var/www/html/glpi/files
      - glpi_marketplace:/var/www/html/glpi/marketplace
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ============================================================================
  # 3. MOCK MAIL: GreenMail (Fallback & Fast TDD/Testing per Mailgate)
  # Profilo: "mock" (Default)
  # ============================================================================
  mockmail:
    image: greenmail/standalone:2.1.3
    container_name: lab-mockmail
    profiles: ["mock", "all"]
    restart: unless-stopped
    networks:
      lab_net:
        ipv4_address: 172.28.0.20
    ports:
      - "${MOCK_SMTP_PORT}:3025"   # SMTP
      - "${MOCK_IMAP_PORT}:3143"   # IMAP
      - "${MOCK_IMAPS_PORT}:3993"  # IMAPS
      - "${MOCK_WEB_PORT}:8080"    # HTTP API
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled=false
        -Dgreenmail.users=support@lab.local:supportpass,user1@lab.local:user1pass

  # ============================================================================
  # 4. DNSMASQ: Risolutore DNS locale per Zimbra (Risoluzione MX / FQDN obbligatoria)
  # Profilo: "zimbra"
  # ============================================================================
  dnsmasq:
    image: andysh/dnsmasq:latest
    container_name: lab-dnsmasq
    profiles: ["zimbra", "all"]
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    networks:
      lab_net:
        ipv4_address: 172.28.0.53
    volumes:
      - ./dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro

  # ============================================================================
  # 5. ZIMBRA COLLABORATION SUITE (ZCS 8.8.15)
  # Profilo: "zimbra" (Richiede min 8-12 GB di RAM su Docker Desktop)
  # ============================================================================
  zimbra:
    image: ianw/zimbra-docker:8.8.15
    container_name: lab-zimbra
    profiles: ["zimbra", "all"]
    hostname: mail
    domainname: lab.local
    restart: unless-stopped
    dns:
      - 172.28.0.53
    depends_on:
      - dnsmasq
    networks:
      lab_net:
        ipv4_address: 172.28.0.25
    ports:
      - "${ZIMBRA_ADMIN_PORT}:7071"      # Console Amministrativa HTTPS
      - "${ZIMBRA_WEB_PORT}:80"          # Webmail HTTP
      - "${ZIMBRA_WEB_SECURE_PORT}:443"  # Webmail HTTPS
      - "${ZIMBRA_SMTP_PORT}:25"         # SMTP (Mappata su 2525 per evitare conflitti con macOS postfix)
      - "587:587"                        # Submission
      - "465:465"                        # SMTPS
      - "${ZIMBRA_IMAP_PORT}:143"        # IMAP (Mappata su 1143)
      - "${ZIMBRA_IMAPS_PORT}:993"       # IMAPS (Mappata su 1993)
    environment:
      PASSWORD: ${ZIMBRA_ADMIN_PASSWORD}
    volumes:
      - zimbra_data:/opt/zimbra
    deploy:
      resources:
        limits:
          memory: 12G
