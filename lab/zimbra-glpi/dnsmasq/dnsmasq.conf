# Non inoltrare nomi senza dominio
domain-needed
bogus-priv

listen-address=0.0.0.0
bind-interfaces

# Dominio del laboratorio
domain=lab.local
local=/lab.local/

# Indirizzi IP statici nella rete Docker 172.28.0.0/16
address=/mail.lab.local/172.28.0.25
address=/glpi.lab.local/172.28.0.10

# Record MX obbligatorio per il self-check di Postfix/ZCS
mx-host=lab.local,mail.lab.local,10

# Forwarding DNS per risoluzione esterna
server=8.8.8.8
server=1.1.1.1
